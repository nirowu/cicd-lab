name: CI

on:
  push:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ci:
    name: Typecheck, Format, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Run tests with JUnit report
        id: test
        continue-on-error: true
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Publish test results
        if: ${{ always() && !env.ACT }}
        uses: dorny/test-reporter@v2
        with:
          name: Vitest Test Results
          path: reports/vitest-junit.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Fail pipeline if tests failed
        if: ${{ steps.test.outcome == 'failure' }}
        run: exit 1
